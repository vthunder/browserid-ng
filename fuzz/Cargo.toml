# Security audit 2026-11 WS3 — cargo-fuzz targets for the wire parsers.
#
# Standalone workspace on purpose: the root Cargo.toml's member list drives the
# Dockerfile's dependency-caching stage, and libfuzzer-sys needs nightly. Build
# and run only through `cargo +nightly fuzz` (see README.md / `make fuzz-smoke`).
[package]
name = "browserid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
chrono = "0.4"
jsonschema = { version = "0.26", default-features = false }
browserid-core = { path = "../browserid-core" }
browserid-registrar = { path = "../browserid-registrar" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "gen_seeds"
path = "src/bin/gen_seeds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jws_parse"
path = "fuzz_targets/jws_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claims_json"
path = "fuzz_targets/claims_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scope_parse"
path = "fuzz_targets/scope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_txt"
path = "fuzz_targets/dns_txt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "status_list"
path = "fuzz_targets/status_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_kind_json"
path = "fuzz_targets/request_kind_json.rs"
test = false
doc = false
bench = false
