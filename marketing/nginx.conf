# Markdown content negotiation (acceptmarkdown.com): an agent sending
# `Accept: text/markdown` gets the page's .md variant; everyone else gets the
# .html one. The map picks the extension try_files reaches for first.
map $http_accept $negotiated_ext {
    default           ".html";
    "~*text/markdown" ".md";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mime.types has no entry for .md — declare it (plus the standard table,
    # since a `types` block here would otherwise REPLACE the inherited one).
    include /etc/nginx/mime.types;
    types { text/markdown md; }
    # acceptmarkdown.com requires `text/markdown; charset=utf-8`. charset_types
    # limits the charset suffix to markdown, leaving every other type as-is.
    charset utf-8;
    charset_types text/markdown;

    # Agent-friendly 404: a real 404 status with a short markdown body pointing
    # at llms.txt / the sitemap, instead of the default nginx HTML page.
    error_page 404 /404.md;

    # Relative Location headers on redirects — behind the TLS proxy the
    # internal scheme is http, so absolute redirects would bounce through
    # http:// before HSTS corrects them.
    absolute_redirect off;

    # v3 IA: the agents page is absorbed by index/developers, and the guestbook
    # demo lives on the home page. The broker still 308s its /guestbook to this
    # origin, so both need redirects here.
    location = /agents {
        return 301 /;
    }
    location = /guestbook {
        return 301 "/#guestbook";
    }

    # Clean URLs for the support pages. try_files serves the file in THIS
    # location context (no re-match), so the \.html no-cache rule below never
    # applies here — repeat it, or browsers heuristically cache the page and
    # render a stale bundle (bit us 2026-07-29).
    location ~ ^/(developers|domains|demos|gate|mcp-demo|about|contact|privacy)$ {
        add_header Cache-Control "no-cache";
        # Content-negotiated: .md when the client asks for text/markdown, .html
        # otherwise — so caches MUST key on Accept (Vary), per acceptmarkdown.com.
        add_header Vary "Accept";
        try_files $uri$negotiated_ext $uri.html =404;
    }

    # Home page, same negotiation. try_files serves in THIS location context,
    # so the headers here cover both variants.
    location = / {
        add_header Cache-Control "no-cache";
        add_header Vary "Accept";
        try_files /index$negotiated_ext /index.html =404;
    }

    # The API surface lives on the auth origin (https://browserid.me — see
    # /openapi.json). Anything API-shaped probed here gets a structured JSON
    # error, never an HTML page.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"No API is served on www.browserid.me.","hint":"The BrowserID broker API lives at https://browserid.me - see the OpenAPI spec.","docs":"https://www.browserid.me/openapi.json"}}';
    }

    # OpenAPI description of the broker's public API. CORS-open: it's public
    # documentation, and agent tooling fetches it cross-origin.
    location = /openapi.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # llms.txt — the agent-facing front door. text/plain via mime.types; keep it
    # fresh like the HTML so edits propagate on next load.
    location = /llms.txt {
        add_header Cache-Control "no-cache";
    }

    # config.js carries the auth-origin pointer — must not be hard-cached, so a
    # change to authOrigin propagates on next load.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # HTML: always revalidate (cheap; keeps content fresh without hard caching).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy PostHog ingestion so it's first-party (no third-party
    # connection, not eaten by ad-blockers). posthog-js is configured with
    # api_host:'/ingest'. Only ingestion is proxied — the JS bundle is
    # self-hosted (/vendor/posthog.js) and remote config is disabled client-side.
    location /ingest/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # The vendored PostHog bundle is immutable (version-pinned) — cache it hard.
    location = /vendor/posthog.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
