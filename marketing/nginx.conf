server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URL for the guestbook page.
    location = /guestbook {
        try_files /guestbook.html =404;
    }

    # config.js carries the auth-origin pointer — must not be hard-cached, so a
    # change to authOrigin propagates on next load.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # HTML: always revalidate (cheap; keeps content fresh without hard caching).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
