server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # v3 IA: the agents page is absorbed by index/developers, and the guestbook
    # demo lives on the home page. The broker still 308s its /guestbook to this
    # origin, so both need redirects here.
    location = /agents {
        return 301 /;
    }
    location = /guestbook {
        return 301 "/#guestbook";
    }

    # Clean URLs for the support pages. try_files serves the file in THIS
    # location context (no re-match), so the \.html no-cache rule below never
    # applies here — repeat it, or browsers heuristically cache the page and
    # render a stale bundle (bit us 2026-07-29).
    location ~ ^/(developers|domains|demos)$ {
        add_header Cache-Control "no-cache";
        try_files $uri.html =404;
    }

    # llms.txt — the agent-facing front door. text/plain via mime.types; keep it
    # fresh like the HTML so edits propagate on next load.
    location = /llms.txt {
        add_header Cache-Control "no-cache";
    }

    # config.js carries the auth-origin pointer — must not be hard-cached, so a
    # change to authOrigin propagates on next load.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # HTML: always revalidate (cheap; keeps content fresh without hard caching).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy PostHog ingestion so it's first-party (no third-party
    # connection, not eaten by ad-blockers). posthog-js is configured with
    # api_host:'/ingest'. Only ingestion is proxied — the JS bundle is
    # self-hosted (/vendor/posthog.js) and remote config is disabled client-side.
    location /ingest/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # The vendored PostHog bundle is immutable (version-pinned) — cache it hard.
    location = /vendor/posthog.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
