[workspace]
resolver = "2"
members = [
    "browserid-core",
    "browserid-dnssec",
    "browserid-registrar",
    "browserid-broker",
    "browserid-agent",
    "browserid-rp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/nicksandmill/browserid-ng"

[workspace.dependencies]
# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "serde", "zeroize"] }
zeroize = "1"
rand = "0.8"
sha2 = "0.10"

# JWT / JWS
jsonwebtoken = "9"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "blocking"] }

# DNS / DNSSEC
hickory-client = { version = "0.25", features = ["tls-ring"] }
# TLS for DNS-over-TLS (versions must match hickory-proto 0.25's rustls dependency)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Password hashing
bcrypt = "0.16"

# Cookies and middleware
tower-cookies = "0.10"
tower = "0.5"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
