<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrowserID MCP Gateway — admin console</title>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo"><i></i></span>
      <span class="brand">BrowserID MCP Gateway</span>
      <nav id="tabs" class="tabs" hidden></nav>
      <span class="spacer"></span>
      <span id="staged-anchor" class="staged-anchor" hidden></span>
      <span id="admin-email" class="admin-email" hidden></span>
      <button id="signout" class="btn-signout" hidden>Sign out</button>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle theme">☀</button>
    </div>
  </header>
  <main id="signed-out" hidden></main>
  <main id="content" class="content" hidden></main>
  <p class="footer">gate · secured by <a href="https://browserid.me">browserid.me</a></p>
</div>
<div id="modal-root"></div>
<script src="/admin/app.js" defer></script>
</body>
</html>
