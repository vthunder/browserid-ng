# Build the guestbook MCP in CI and deploy the IMAGE to dokku — same pattern
# as deploy-wallet.yml (the host never builds; git:from-image pulls the image).
#
# One-time setup (mirrors the wallet runbook) — app created 2026-07-29;
# remaining at first deploy: DNS A record, letsencrypt, ghcr package public:
# - reuses repo secret DOKKU_SSH_KEY + repo variable DOKKU_HOST
# - on the host:
#     dokku apps:create guestbook-mcp
#     dokku builder:set guestbook-mcp selected dockerfile
#     dokku domains:set guestbook-mcp guestbook-mcp.browserid.me
#     dokku ports:set guestbook-mcp http:80:3200
#     dokku config:set guestbook-mcp SERVICE_ORIGIN=https://guestbook-mcp.browserid.me
#     dokku letsencrypt:enable guestbook-mcp   (after DNS exists)
# - DNS: guestbook-mcp.browserid.me A record → the dokku host
# - ghcr package visibility needs NO manual step: packages published by
#   Actions from a PUBLIC repo inherit that visibility, so dokku pulls them
#   anonymously (verified 2026-08-06 across every package here).
#
# Stateless service: no storage mount, no secrets. All config has prod-safe
# defaults (broker/wallet URLs point at browserid.me / wallet.browserid.me).

name: deploy-guestbook

on:
  push:
    branches: [main]
    paths:
      - "guestbook-mcp/**"
      - ".github/workflows/deploy-guestbook.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vthunder/browserid-ng/guestbook-mcp

jobs:
  build-and-deploy:
    # Only the canonical repo deploys/publishes; the public staging mirror
    # runs this file too and must never touch production (ip-approval PLAN).
    if: github.repository == 'vthunder/browserid-ng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The node test suite is not covered by test.yml (Rust only) — gate the
      # deploy on it here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        working-directory: guestbook-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: guestbook-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dokku
        if: ${{ vars.DOKKU_HOST != '' }}
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOKKU_SSH_KEY" > ~/.ssh/dokku_key
          chmod 600 ~/.ssh/dokku_key
          # `git:from-image` exits 1 on an unchanged image digest — a re-run of an
          # already-released sha is a no-op, not a failure.
          out=$(ssh -i ~/.ssh/dokku_key -o StrictHostKeyChecking=accept-new \
            "dokku@$DOKKU_HOST" git:from-image guestbook-mcp "$IMAGE:$GITHUB_SHA" 2>&1) \
            || { echo "$out" | grep -q "No changes detected" \
                 && echo "no-op: image digest unchanged (already deployed)" \
                 || { echo "$out" | tail -30; exit 1; }; }
          echo "$out" | tail -5
