# Build the marketing site (www.browserid.me) in CI and deploy the IMAGE to
# dokku — same pattern as deploy-guestbook.yml / deploy-wallet.yml.
#
# Replaces the old `git subtree push --prefix marketing` deploy, which was the
# last identity-host app whose build was not reproducible from a pinned image
# (browserid-ng-gzq7). With this, every app on the identity host rebuilds from
# GHCR and the host never builds anything.
#
# The build context is `marketing/`, not the repo root: marketing/Dockerfile
# COPYs its files by relative path (nginx.conf, index.html, vendor/).
#
# Package visibility needs NO manual step: a package published by Actions from
# a PUBLIC repo inherits that visibility, so dokku (which holds no registry
# credentials) can pull it anonymously. Verified 2026-08-06 against every
# package here — all anonymously pullable, none ever set by hand.
#
# One-time setup at first run:
# - the app's builder must not carry a custom dockerfile-path: git:from-image
#   generates its own root Dockerfile, and a stale custom path fails with
#   `Invalid dockerfile-path`. `www` currently uses the default, so nothing to
#   do — but re-check if that ever changes.
# - note that `git:from-image` is a no-op on an unchanged image digest
#   (`No changes detected`, exit 1); only bites when redeploying the same sha.

name: deploy-www

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/deploy-www.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vthunder/browserid-ng/www

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: marketing
          file: marketing/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate the release on the agent-surface contract (markdown 404s,
      # Accept: text/markdown negotiation + Vary, openapi.json, JSON /api
      # errors, llms.txt/robots/sitemap). The script builds the same
      # Dockerfile locally — cheap, tiny context.
      - name: Smoke-test the image
        run: marketing/test.sh

      - name: Deploy to dokku
        if: ${{ vars.DOKKU_HOST != '' }}
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOKKU_SSH_KEY" > ~/.ssh/dokku_key
          chmod 600 ~/.ssh/dokku_key
          # `git:from-image` exits 1 on an unchanged image digest — a re-run of an
          # already-released sha is a no-op, not a failure.
          out=$(ssh -i ~/.ssh/dokku_key -o StrictHostKeyChecking=accept-new \
            "dokku@$DOKKU_HOST" git:from-image www "$IMAGE:$GITHUB_SHA" 2>&1) \
            || { echo "$out" | grep -q "No changes detected" \
                 && echo "no-op: image digest unchanged (already deployed)" \
                 || { echo "$out" | tail -30; exit 1; }; }
          echo "$out" | tail -5
