# Build the Python FastMCP demo in CI and deploy the IMAGE to dokku — same
# pattern as deploy-mcp-demo.yml.
#
# One-time setup (on the id-host via mini-ops, at first deploy):
#     dokku apps:create python-mcp-demo
#     dokku builder:set python-mcp-demo selected dockerfile
#     dokku domains:set python-mcp-demo python-mcp-demo.browserid.me
#     dokku ports:set python-mcp-demo http:80:3400
#     dokku config:set python-mcp-demo MCP_RESOURCE=https://python-mcp-demo.browserid.me
#     dokku letsencrypt:enable python-mcp-demo
# DNS: covered by the *.browserid.me wildcard. GHCR package inherits repo visibility.
# Stateless, no secrets. Manual release path (CI ssh step is o7ip): mini-ops git:from-image.

name: deploy-python-mcp-demo

on:
  push:
    branches: [main]
    paths:
      - "python-mcp-demo/**"
      - "sdk/python-mcp-auth/**"
      - ".github/workflows/deploy-python-mcp-demo.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vthunder/browserid-ng/python-mcp-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate the deploy on the integration test (token -> bearer -> tool call).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integration test
        working-directory: python-mcp-demo
        run: |
          pip install -r requirements.txt ../sdk/python-mcp-auth
          python test_integration.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: python-mcp-demo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dokku
        if: ${{ vars.DOKKU_HOST != '' }}
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOKKU_SSH_KEY" > ~/.ssh/dokku_key
          chmod 600 ~/.ssh/dokku_key
          # `git:from-image` exits 1 on an unchanged image digest — a re-run of an
          # already-released sha is a no-op, not a failure.
          out=$(ssh -i ~/.ssh/dokku_key -o StrictHostKeyChecking=accept-new \
            "dokku@$DOKKU_HOST" git:from-image python-mcp-demo "$IMAGE:$GITHUB_SHA" 2>&1) \
            || { echo "$out" | grep -q "No changes detected" \
                 && echo "no-op: image digest unchanged (already deployed)" \
                 || { echo "$out" | tail -30; exit 1; }; }
          echo "$out" | tail -5
