# Node unit tests for the SDK packages (test.yml covers only Rust). Non-gating
# for deploys; a fast signal that the JS SDKs stay green.
name: sdk-tests

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "test-vectors/**"
      - ".github/workflows/sdk-tests.yml"
  workflow_dispatch: {}

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Security audit 2026-11 WS2: every SDK verifier runs the conformance
      # vector suite (test-vectors/) against the hosted responses recorded by
      # the Rust CI job; per-runner expected-fail lists carry
      # `AUDIT-2026-11 <finding>`. docs/security-audit-2026-11-ws2-conformance.md.
      - name: verify (sdk/js) tests + conformance vectors
        working-directory: sdk/js
        run: node --test
      - name: mcp-auth tests
        working-directory: sdk/mcp-auth
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/*.test.mjs
      - name: gate conformance vectors
        working-directory: sdk/gate
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/conformance-vectors.test.mjs
      - name: nextauth tests
        working-directory: sdk/nextauth
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/*.test.mjs
      - name: express tests
        working-directory: sdk/express
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/*.test.mjs
      - name: hono tests
        working-directory: sdk/hono
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/*.test.mjs
      - name: fastify tests
        working-directory: sdk/fastify
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test test/*.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: python mcp-auth tests
        working-directory: sdk/python-mcp-auth
        run: python -m unittest discover -s tests -v
      # Drift gate (bean 1bqx): fails when a package's content differs from
      # what the registry serves at the SAME version — i.e. someone changed
      # shipped code without bumping. The fix is always to bump the version
      # in this PR; publishing itself happens in publish.yml on main.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: publish drift gate
        run: node scripts/publish-status.mjs
