# Node unit tests for the SDK packages (test.yml covers only Rust). Non-gating
# for deploys; a fast signal that the JS SDKs stay green.
name: sdk-tests

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    paths:
      - "sdk/**"
  workflow_dispatch: {}

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: mcp-auth tests
        working-directory: sdk/mcp-auth
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - name: nextauth tests
        working-directory: sdk/nextauth
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - name: express tests
        working-directory: sdk/express
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - name: hono tests
        working-directory: sdk/hono
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - name: fastify tests
        working-directory: sdk/fastify
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python mcp-auth tests
        working-directory: sdk/python-mcp-auth
        run: python -m unittest discover -s tests -v
      # Drift gate (bean 1bqx): fails when a package's content differs from
      # what the registry serves at the SAME version — i.e. someone changed
      # shipped code without bumping. The fix is always to bump the version
      # in this PR; publishing itself happens in publish.yml on main.
      - uses: astral-sh/setup-uv@v10
      - name: publish drift gate
        run: node scripts/publish-status.mjs
