<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>browserid.me — agent consent</title>
  <!-- Flow P of the agent-flows-v2 design (bean eywc): permission requests
       for a KNOWN agent. Identity is already settled, so it is stated, never
       asked: every card opens with the user-chosen name from Flow I. The only
       question is the permission itself; "on behalf of" is a dropdown (the
       agent itself, or an identity of yours) unless the request pinned the
       grantor. An agent this account has never met gets a deny-only card. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px; line-height: 1.5; color: #333; background-color: #f5f5f5; }
    .wrap { max-width: 440px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand a { color: #333; text-decoration: none; font-weight: 600; font-size: 16px; }
    .brand .me { color: #4a90d9; }
    .footer-links { text-align: center; font-size: 13px; color: #888; }
    .footer-links a { margin: 0 8px; color: #4a90d9; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    .status { font-size: 13px; margin-top: 8px; }
    .muted { color: #888; } .err { color: #dc3545; } .ok { color: #2f855a; }
    .mono { font-family: ui-monospace, Menlo, monospace; }

    /* Design-board card language — mirrors account.html's .pv* rules. */
    .pvcard { background: #fff; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 24px 22px 20px; margin-bottom: 20px; color: #17171a; border: 1px solid rgba(0,0,0,.09); }
    .pvcard.danger { border-color: rgba(157,47,38,.24); }
    .pvcard.hot { box-shadow: 0 0 0 2px rgba(31,111,235,.35), 0 4px 24px rgba(0,0,0,.08); }
    .pv-head { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .pv-mark { width: 15px; height: 15px; border-radius: 4px; background: #17171a; }
    .pv-brand { font-weight: 600; font-size: 12px; color: #17171a; }
    .pv-corner { margin-left: auto; font: 11px/1 ui-monospace, Menlo, monospace; color: #8a8a93; word-break: break-all; text-align: right; }
    .pv-title { font: 400 20px/1.4 system-ui, sans-serif; letter-spacing: -.01em; margin: 0 0 12px; color: #17171a; text-wrap: pretty; }
    .pv-note { font: 13px/1.65 system-ui, sans-serif; color: #6b6b74; margin: 0 0 14px; }
    .pv-note b, .pv-note .mono { color: #17171a; }
    .pv-panel { border: 1px solid rgba(0,0,0,.11); border-radius: 9px; padding: 12px 13px; margin-bottom: 8px; }
    .pv-label { font: 10.5px/1.3 system-ui, sans-serif; color: #8a8a93; margin-bottom: 3px; }
    .pv-hint { font: 11px/1.5 system-ui, sans-serif; color: #8a8a93; margin: 0 0 14px; }
    .pv-aud { font: 12.5px/1.5 ui-monospace, Menlo, monospace; color: #17171a; word-break: break-all; margin-bottom: 8px; }
    .pv-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .pv-chip { font: 10px/1.3 ui-monospace, Menlo, monospace; color: #6b6b74; border: 1px solid rgba(0,0,0,.14); border-radius: 20px; padding: 4px 8px; word-break: break-all; }
    .pv-chip.warn { color: #b7791f; border-color: rgba(183,121,31,.4); }
    .pv-table { border: 1px solid rgba(0,0,0,.1); border-radius: 9px; overflow: hidden; margin-bottom: 6px; }
    .pv-row { padding: 11px 13px; background: #faf9f7; display: flex; gap: 10px; }
    .pv-row + .pv-row { border-top: 1px solid rgba(0,0,0,.07); }
    .pv-rowlabel { font: 11px/1.4 system-ui, sans-serif; color: #8a8a93; flex: none; width: 40px; }
    .pv-rowmain { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #17171a; word-break: break-all; }
    .pv-rowsub { font: 10.5px/1.4 system-ui, sans-serif; color: #8a8a93; margin-top: 2px; }
    .pv-callout { padding: 12px 14px; background: #f4f6fb; border-left: 2px solid #1f6feb; border-radius: 0 8px 8px 0;
      font: 13px/1.6 system-ui, sans-serif; color: #33333a; margin: 0 0 9px; }
    .pv-callout.danger { background: #fdf6f5; border-left-color: #9d2f26; color: #5c3a36; }
    .pv-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
    .pv-btn { font: 600 15px/1 system-ui, sans-serif; color: #fff; background: #17171a; border: none; border-radius: 9px;
      padding: 14px; text-align: center; cursor: pointer; width: 100%; }
    .pv-btn:hover:not(:disabled) { background: #000; }
    .pv-btn:disabled { opacity: .55; cursor: not-allowed; }
    .pv-btn2 { font: 600 14.5px/1 system-ui, sans-serif; color: #17171a; background: #fff; border: 1px solid rgba(0,0,0,.18);
      border-radius: 9px; padding: 13px; text-align: center; cursor: pointer; width: 100%; }
    .pv-btn2:hover:not(:disabled) { background: #faf9f7; }
    .pv-btn2:disabled { opacity: .55; cursor: not-allowed; }
    .pv-ghost { font: 500 13px/1 system-ui, sans-serif; color: #6b6b74; background: none; border: none; padding: 7px;
      text-align: center; cursor: pointer; width: 100%; }
    .pv-ghost:hover:not(:disabled) { color: #17171a; }
    .pv-ghost:disabled { opacity: .55; cursor: not-allowed; }
    .pv-foot { margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,.08); display: flex; gap: 7px; align-items: flex-start; }
    .pv-badge { font: 9.5px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: #8a8a93;
      border: 1px solid rgba(0,0,0,.16); border-radius: 4px; padding: 2px 5px; flex: none; margin-top: 1px; }
    .pv-footnote { font: 11.5px/1.5 system-ui, sans-serif; color: #8a8a93; }
    .pv-obsel { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #17171a; border: 1px solid rgba(0,0,0,.14);
      border-radius: 6px; padding: 4px 6px; background: #fff; max-width: 100%; }
    details.pv-signed { margin: 0 0 9px; }
    details.pv-signed summary { font: 12px/1.4 system-ui, sans-serif; color: #1f6feb; cursor: pointer; list-style: none; }
    details.pv-signed summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="/">browserid<span class="me">.me</span></a></div>

  <div id="auth-gate" class="pvcard"><p style="margin:0" class="muted">Checking your session…</p></div>
  <div id="list" hidden></div>

  <p class="footer-links"><a href="/account">Manage agents &amp; grants</a> · <a href="/">browserid.me</a></p>
</div>

<script src="/common/js/keystore.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const b64urlJson = (obj) => btoa(String.fromCharCode(...enc.encode(JSON.stringify(obj))))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64urlToJson = (seg) => JSON.parse(atob(seg.replace(/-/g,'+').replace(/_/g,'/')));
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let csrf = null;
let statusUri = null;
// The account's root (non-agent) identities — the on-behalf dropdown's pool.
let rootIds = [];
// The account's registered warrants, used to state (not ask) each agent's
// established relation: how it was authorized is how later grants are signed.
let registry = [];
// Deep-linked code from /consent/<code>, if any.
const linkedCode = location.pathname.match(/^\/consent\/(.+)$/)?.[1] || null;

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok || body.success === false) throw new Error(body.reason || body.error || `HTTP ${r.status}`);
  return body;
}

/// Whether a device-cert identities entry covers `email`: exact, single-`*`
/// glob, or the protocol's subaddress rule (a cert naming the base identity
/// authorizes its `+tag` sub-addresses) — mirrors browserid-core
/// device::identity_matches.
function identityMatches(pattern, email) {
  if (pattern === email || pattern === '*') return true;
  const star = pattern.indexOf('*');
  if (star !== -1) {
    const pre = pattern.slice(0, star), post = pattern.slice(star + 1);
    return email.length >= pre.length + post.length
      && email.startsWith(pre) && email.endsWith(post);
  }
  const pa = pattern.indexOf('@'), ea = email.indexOf('@');
  if (pa < 0 || ea < 0) return false;
  const pLocal = pattern.slice(0, pa), eLocal = email.slice(0, ea);
  return pattern.slice(pa) === email.slice(ea)
    && eLocal.length > pLocal.length && eLocal.startsWith(pLocal) && eLocal[pLocal.length] === '+';
}

/// The CONFIG (authorization) device cert + non-extractable key in this
/// browser's keystore that can sign warrants naming `grantorEmail` — the
/// attributed identity, which the cert must be authoritative for. Prefers one
/// stored for `delegatorEmail`. Deposited by the login dialog at sign-in.
async function localConfig(delegatorEmail, grantorEmail) {
  const recs = (await window.Keystore.allDevice()).filter(r => r.kind === 'config' && r.cert && r.privateKey);
  const now = Math.floor(Date.now() / 1000);
  const candidates = [];
  for (const rec of recs) {
    let claims;
    try { claims = b64urlToJson(rec.cert.split('.')[1]); } catch { continue; }
    if (!claims.exp || claims.exp <= now + 60) continue;
    if (claims.purpose !== 'authorization') continue;
    if (!(claims.identities || []).some(p => identityMatches(p, grantorEmail))) continue;
    candidates.push({ rec, claims });
  }
  candidates.sort((a, b) => (a.rec.email === delegatorEmail ? -1 : 0) - (b.rec.email === delegatorEmail ? -1 : 0));
  const hit = candidates[0];
  return hit ? { cert: hit.rec.cert, privateKey: hit.rec.privateKey } : null;
}

/// Sign one device-model warrant with the config key: `grantor` (the
/// attributed identity) delegates to `grantee` (the actor) over
/// (holder-matcher) → audience[+scopes]. `status` ({uri, idx},
/// registrar-allocated) makes the single grant revocable.
async function signWarrant(config, grantor, grantee, audience, scopes, status, holder) {
  const now = Math.floor(Date.now() / 1000);
  const header = b64urlJson({ alg: 'EdDSA', typ: 'JWT' });
  const claims = {
    typ: 'browserid-warrant-v1',
    iat: now,
    exp: now + 90 * 24 * 3600,
    grantor: grantor,
    grantee: grantee,
    holder: holder,
    audience: audience,
  };
  if (scopes && scopes.length) claims.scopes = scopes;
  if (status) claims.status = status;
  const payload = b64urlJson(claims);
  const sig = await window.Keystore.sign(config.privateKey, `${header}.${payload}`);
  return `${header}.${payload}.${sig}`;
}

// ---- classification ------------------------------------------------------
// The identity question was settled when the agent was authorized (Flow I);
// here it is only restated. Server facts pick the card:
//   external              → B3: a foreign service — you must be the authority
//   agent == delegator    → B2: an agent that IS you (provisioned as-you)
//   !known                → P4: a stranger — deny is the only action
//   otherwise             → P1/P2: the common card — who · why · what

/// The agent's established relation, read from its registered warrants:
/// 'onbehalf' when any existing warrant names a distinct grantor, else
/// 'standalone' when it only ever acted as itself, else the on-behalf
/// default (the A1 default — how new agents are authorized).
function establishedRelation(agentEmail) {
  let sawSelf = false;
  for (const w of registry) {
    if ((w.agent_email || '').toLowerCase() !== agentEmail.toLowerCase()) continue;
    let claims;
    try { claims = b64urlToJson(w.warrant.split('.')[1]); } catch { continue; }
    if (claims.grantor && claims.grantee && claims.grantor !== claims.grantee) return 'onbehalf';
    if (claims.grantor && claims.grantor === claims.grantee) sawSelf = true;
  }
  return sawSelf ? 'standalone' : 'onbehalf';
}

/// When this agent was first authorized, from the registry (if we have it).
function authorizedSince(agentEmail) {
  let first = null;
  for (const w of registry) {
    if ((w.agent_email || '').toLowerCase() !== agentEmail.toLowerCase()) continue;
    const t = Date.parse(w.signed_at);
    if (t && (!first || t < first)) first = t;
  }
  return first ? new Date(first).toLocaleDateString(undefined, { month: 'long', day: 'numeric' }) : null;
}

// ---- card fragments ------------------------------------------------------

const PV_FORBY_HINT = '“For” — whose account the actions count against. “By” — who does them. ' +
  'The approval itself is signed by the account shown top-right.';

function pvHead(corner) {
  return `<div class="pv-head"><div class="pv-mark"></div><span class="pv-brand">browserid</span>` +
    (corner ? `<span class="pv-corner">${escapeHtml(corner)}</span>` : '') + `</div>`;
}

// The audience is a requester-supplied string. A non-web identifier must not
// pass as a URL at a glance; plain http gets a lighter note.
function audienceWarn(aud) {
  try {
    const u = new URL(aud);
    if (u.protocol === 'https:') return null;
    if (u.protocol === 'http:') return 'not an https site';
  } catch (e) { /* not URL-shaped */ }
  return 'not a web address — recognize it, or deny';
}

function grantBlocks(grants) {
  return (grants || []).map(g => {
    const warn = audienceWarn(g.audience);
    const chips = (g.scopes || []).map(s => `<span class="pv-chip">${escapeHtml(s)}</span>`).join('')
      || '<span class="pv-chip">site-level access</span>';
    return `<div class="pv-panel"><div class="pv-aud">${escapeHtml(g.audience)}</div>
      <div class="pv-chips">${chips}${warn ? `<span class="pv-chip warn">${escapeHtml(warn)}</span>` : ''}</div></div>`;
  }).join('');
}

function unverifiedFoot(text) {
  return `<div class="pv-foot"><span class="pv-badge">UNVERIFIED</span>
    <div class="pv-footnote">${text}</div></div>`;
}

function expiryLine(r) {
  return `<p class="pv-footnote" style="text-align:center;margin:6px 0 0">warrant lasts 90 days ·
    request expires ${escapeHtml(new Date(r.expires_at).toLocaleTimeString())}</p>`;
}

// "What gets signed →" — the exact roles, stated before the button.
function whatGetsSigned(r, grantor) {
  return `<details class="pv-signed"><summary>What gets signed →</summary>
    <div class="pv-table" style="margin-top:8px">
      <div class="pv-row"><span class="pv-rowlabel">For</span><div style="min-width:0;flex:1">
        <div class="pv-rowmain">${escapeHtml(grantor)}</div></div></div>
      <div class="pv-row"><span class="pv-rowlabel">By</span><div style="min-width:0;flex:1">
        <div class="pv-rowmain">${escapeHtml(r.agent_email)}</div></div></div>
    </div><p class="pv-hint" style="margin-top:6px">${PV_FORBY_HINT}</p></details>`;
}

function approveLabel(r, text) {
  const n = (r.grants || []).length;
  return n > 2 ? `${text} all ${n}` : n === 2 ? `${text} both` : text;
}

// The display name every P card opens with: the name chosen at Flow I step 2,
// else the agent's local part (older agents, named before display names).
function agentName(r) {
  return (r.display_name || '').trim() || r.agent_email.split('@')[0];
}

// "created April 12" — the host's record of when this account met the agent,
// falling back to the registry's earliest warrant.
function createdLine(r) {
  const t = r.agent_created_at ? Date.parse(r.agent_created_at) : null;
  const d = t ? new Date(t).toLocaleDateString(undefined, { month: 'long', day: 'numeric' })
    : authorizedSince(r.agent_email);
  return d ? `created ${d}` : null;
}

// P1/P2 — the common case: who (your name for it) · why (the agent's own
// message, quoted and unverified — helpful without being trusted; the chips
// remain the ground truth) · what (site + permissions + on whose behalf).
// The on-behalf account is a dropdown when the request doesn't pin it —
// pinned requests show it as plain text and the only choice is allow/deny.
function cardP(r) {
  const name = agentName(r);
  const created = createdLine(r);
  const message = (r.message || '').trim()
    || ((r.label || '').trim().toLowerCase() !== r.agent_email.toLowerCase() ? (r.label || '').trim() : '');
  const pin = (r.grantor || '*');
  const pinned = pin !== '*';
  const pinnedSelf = pinned && pin.toLowerCase() === r.agent_email.toLowerCase();
  // Unpinned default: how the agent was authorized is how later grants lean.
  const defaultChoice = establishedRelation(r.agent_email) === 'standalone' ? 'self' : r.delegator_email;
  let obCell;
  if (pinnedSelf) {
    obCell = `<span class="mono" style="color:#17171a">itself only</span> <span class="pv-footnote">· requested</span>`;
  } else if (pinned) {
    obCell = `<span class="mono" style="color:#17171a">${escapeHtml(pin)}</span> <span class="pv-footnote">· requested</span>`;
  } else {
    const opts = [`<option value="self"${defaultChoice === 'self' ? ' selected' : ''}>itself only</option>`]
      .concat(rootIds.map(e => `<option value="${escapeHtml(e)}"${e === defaultChoice ? ' selected' : ''}>${escapeHtml(e)}</option>`));
    obCell = `<select class="pv-obsel ob-choice" data-code="${escapeHtml(r.code)}">${opts.join('')}</select>`;
  }
  const msgHtml = message
    ? `<div style="font:italic 12.5px/1.6 system-ui,sans-serif;color:#4a4a52">\u201C${escapeHtml(message)}\u201D</div>`
    : `<div style="font:12.5px/1.6 system-ui,sans-serif;color:#8a8a93">None given — it didn\u2019t say what it intends to do with this.</div>`;
  return {
    grantor: pinned ? pin : defaultChoice,
    html: pvHead(r.delegator_email) +
      `<div class="pv-title" style="margin-bottom:14px">${escapeHtml(name)} wants permission.</div>
      <div class="pv-panel" style="background:#faf9f7;margin-bottom:14px">
        <div class="pv-label" style="margin-bottom:5px">Agent</div>
        <div style="font:600 13px/1.4 system-ui,sans-serif;color:#17171a">${escapeHtml(name)}</div>
        <div class="mono" style="font-size:11.5px;line-height:1.5;color:#8a8a93;overflow-wrap:anywhere">${escapeHtml(r.agent_email)}</div>
        ${created ? `<div class="pv-footnote" style="margin-top:4px">${escapeHtml(created)}</div>` : ''}</div>
      <div class="pv-panel" style="background:#faf9f7;margin-bottom:14px">
        <div class="pv-label" style="margin-bottom:5px">Agent message (unverified)</div>${msgHtml}</div>` +
      grantBlocks(r.grants) +
      `<div class="pv-panel" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <span class="pv-footnote">on behalf of</span> ${obCell}</div>
      <div class="pv-actions" style="margin-top:0">
        <button class="pv-btn approve" data-code="${escapeHtml(r.code)}" disabled>${approveLabel(r, 'Allow for 90 days')}</button>
        <button class="pv-ghost deny" data-code="${escapeHtml(r.code)}">Deny</button></div>` +
      expiryLine(r) +
      `<p class="status" id="status-${escapeHtml(r.code)}"></p>`,
  };
}

// P4 — a permission request from an agent this account has never met.
// Phishing-adjacent, so no consent is offered: deny is the only action. A
// legitimate agent should request an identity (Flow I) itself — its poll is
// told exactly that.
function cardP4(r) {
  return {
    grantor: null,
    danger: true,
    denyOnly: true,
    html: pvHead(r.delegator_email) +
      `<div class="pv-title" style="margin-bottom:12px">You haven't met this agent.</div>
      <p class="pv-note" style="margin-bottom:8px">An agent your account doesn't know —
        <span class="mono">${escapeHtml(r.agent_email)}</span> — is asking for permissions.
        Check where this link came from; you may not be talking to the right agent.</p>
      <p class="pv-hint" style="margin-bottom:14px">A legitimate agent introduces itself first.
        Denying tells it to request an identity before asking for permissions.</p>
      <div class="pv-actions" style="margin-top:0">
        <button class="pv-btn2 deny" data-code="${escapeHtml(r.code)}">Deny</button></div>
      <p class="status" id="status-${escapeHtml(r.code)}"></p>`,
  };
}

// B2 — an agent that IS you (provisioned as-you): grantor and grantee are
// both you no matter what. Nothing to choose; the card reports it and offers
// the only real lever.
function cardB2(r) {
  return {
    grantor: r.agent_email,
    danger: true,
    html: pvHead(r.delegator_email) +
      `<div class="pv-title">An agent acting as you wants more access.</div>
      <p class="pv-note">It already holds <span class="mono">${escapeHtml(r.agent_email)}</span> —
        it <b>is</b> you, by your choice. It's asking for
        ${(r.grants || []).length === 1 ? 'a permission' : 'permissions'} it doesn't have yet.
        Anything it does with ${(r.grants || []).length === 1 ? 'it' : 'them'} is recorded as you.</p>` +
      grantBlocks(r.grants) +
      `<div class="pv-callout danger" style="margin-top:6px;font-size:12.5px">If that isn't what you want,
        it can't be fixed here — the identity was fixed when the agent was authorized.</div>
      <div class="pv-actions">
        <button class="pv-btn approve" data-code="${escapeHtml(r.code)}" disabled>Approve — as me</button>
        <button class="pv-btn2 reauth" data-code="${escapeHtml(r.code)}">Re-authorize with its own address</button>
        <button class="pv-ghost deny" data-code="${escapeHtml(r.code)}">Deny</button></div>` +
      expiryLine(r) +
      `<p class="status" id="status-${escapeHtml(r.code)}"></p>`,
  };
}

// B3 — a service you don't run: the actor is foreign, so you must be the
// authority or the warrant means nothing. Grantor = you, grantee = it.
function cardB3(r) {
  const domain = r.agent_email.split('@')[1] || '';
  const label = (r.label || '').trim();
  const showLabel = label && label.toLowerCase() !== r.agent_email.toLowerCase();
  return {
    grantor: r.delegator_email,
    html: pvHead(r.delegator_email) +
      `<div class="pv-title">A service you don't run wants to act in your name.</div>
      <p class="pv-note"><span class="mono">${escapeHtml(r.agent_email)}</span> holds its own credentials
        from its own provider. You aren't giving it an address — you're lending it your name at
        ${(r.grants || []).length === 1 ? 'one site' : 'the sites below'}.</p>
      <div class="pv-table">
        <div class="pv-row"><span class="pv-rowlabel">For</span><div style="min-width:0;flex:1">
          <div class="pv-rowmain">${escapeHtml(r.delegator_email)}</div>
          <div class="pv-rowsub">you — nothing else is possible here</div></div></div>
        <div class="pv-row"><span class="pv-rowlabel">By</span><div style="min-width:0;flex:1">
          <div class="pv-rowmain">${escapeHtml(r.agent_email)}</div>
          <div class="pv-rowsub">not yours · certified by ${escapeHtml(domain)}</div></div></div>
      </div>
      <p class="pv-hint" style="margin-top:6px">${PV_FORBY_HINT}</p>` +
      grantBlocks(r.grants) +
      `<div class="pv-callout" style="margin-top:6px">Only at
        ${(r.grants || []).length === 1 ? 'this location' : 'these locations'}, only the listed
        permissions, for 90 days.</div>
      <div class="pv-actions">
        <button class="pv-btn approve" data-code="${escapeHtml(r.code)}" disabled>Approve</button>
        <button class="pv-ghost deny" data-code="${escapeHtml(r.code)}">Deny</button></div>` +
      expiryLine(r) +
      `<p class="status" id="status-${escapeHtml(r.code)}"></p>` +
      (showLabel ? unverifiedFoot(`Calls itself “${escapeHtml(label)}”. Not checked by browserid.`) : ''),
  };
}

// B4 — nothing waiting: the state people hit most often, from a stale link.
function cardB4() {
  return `<div class="pvcard">` + pvHead('') +
    `<div class="pv-title">Nothing is waiting for you.</div>
    <p class="pv-note" style="margin-bottom:18px">Requests only stay open about fifteen minutes.
      If your agent is still waiting, ask it to try again and keep this page open.</p>
    <div class="pv-actions" style="margin-top:0">
      <button class="pv-btn2" id="see-agents">See my agents</button></div></div>`;
}

function render(requests) {
  const list = $('list');
  list.hidden = false;
  if (!requests.length) {
    list.innerHTML = cardB4();
    $('see-agents').onclick = () => location.assign('/account');
    return;
  }
  const byCode = {};
  list.innerHTML = requests.map(r => {
    const card = r.external ? cardB3(r)
      : r.agent_email.toLowerCase() === r.delegator_email.toLowerCase() ? cardB2(r)
      : r.known === false ? cardP4(r)
      : cardP(r);
    byCode[r.code] = { r, grantor: card.grantor };
    const classes = ['pvcard', card.danger ? 'danger' : '', r.code === linkedCode ? 'hot' : ''].filter(Boolean);
    return `<div class="${classes.join(' ')}" id="req-${escapeHtml(r.code)}">${card.html}</div>`;
  }).join('');

  // The on-behalf dropdown (unpinned P cards): 'self' = the agent itself.
  for (const sel of list.querySelectorAll('select.ob-choice')) {
    const e = byCode[sel.dataset.code];
    sel.onchange = () => {
      e.grantor = sel.value === 'self' ? e.r.agent_email : sel.value;
    };
  }
  for (const b of list.querySelectorAll('button.approve')) {
    const e = byCode[b.dataset.code];
    b.onclick = () => resolve(e.r, true, e.grantor === 'self' ? e.r.agent_email : e.grantor);
    // Brief arming delay: no reflex-click or scripted-focus approval the
    // instant the page paints (complements the frame-ancestors denial).
    setTimeout(() => { b.disabled = false; }, 800);
  }
  for (const b of list.querySelectorAll('button.deny')) {
    b.onclick = () => resolve(byCode[b.dataset.code].r, false, null);
  }
  // "Re-authorize with its own address" can't be granted here — the identity
  // was fixed at authorization. It denies this request and says what to do.
  for (const b of list.querySelectorAll('button.reauth')) {
    b.onclick = () => resolve(byCode[b.dataset.code].r, false, null,
      'Denied. Ask the agent to request authorization again — the new request lets you give it its own address.');
  }
  if (linkedCode && byCode[linkedCode]) {
    document.getElementById(`req-${linkedCode}`)?.scrollIntoView({ behavior: 'smooth' });
  }
}

async function resolve(r, approve, grantor, deniedNote) {
  const status = $(`status-${r.code}`);
  const card = document.getElementById(`req-${r.code}`);
  for (const b of card.querySelectorAll('button')) b.disabled = true;
  try {
    let warrants = null, configCert = null;
    if (approve) {
      status.className = 'status muted';
      status.textContent = 'Signing…';
      const config = await localConfig(r.delegator_email, grantor);
      if (!config) throw new Error(
        `no signing key for ${grantor} in this browser — ` +
        `sign in to an app with that identity here first, then retry`);
      configCert = config.cert;
      // Holder matcher: isolated to the agent's own holder id, always —
      // group-widening is deliberately not offered here.
      warrants = [];
      for (const g of (r.grants || [])) {
        const st = (g.status_idx != null && statusUri)
          ? { uri: statusUri, idx: g.status_idx } : null;
        warrants.push(await signWarrant(config, grantor, r.agent_email, g.audience, g.scopes, st, r.holder));
      }
    }
    await api('/wsapi/warrant_respond', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        csrf, code: r.code, approve, warrants, config_cert: configCert,
        // Only sent when the attributed identity differs from the agent —
        // the on-behalf/foreign shapes (the server defaults to the agent).
        ...(approve && grantor && grantor.toLowerCase() !== r.agent_email.toLowerCase()
          ? { grantor } : {}),
      }),
    });
    status.className = approve ? 'status ok' : 'status muted';
    status.textContent = approve
      ? `Approved${(r.grants || []).length > 1 ? ' (' + r.grants.length + ' grants)' : ''} — the agent picks this up within a few seconds.`
      : (deniedNote || 'Denied — the agent is told immediately, so it isn’t waiting.');
    // Done here — hand the user back. Popup blockers force some mobile
    // browsers to reach this page by same-tab navigation, so when there is
    // history to return through, offer it; a fresh tab can just be closed.
    // On approval we also go back automatically after a short, announced
    // delay — the manual button stays as the fallback (history.back() is a
    // no-op if the browser has nothing to go back to). Denials never
    // auto-navigate: the user may want to look at what they just refused.
    const back = document.createElement('p');
    back.className = 'status muted';
    if (history.length > 1) {
      const b = document.createElement('button');
      b.className = 'pv-ghost';
      b.style.width = 'auto';
      b.textContent = '← Return to the app';
      b.onclick = () => history.back();
      back.appendChild(b);
      if (approve) {
        back.appendChild(document.createTextNode(' returning automatically…'));
        setTimeout(() => history.back(), 1800);
      }
    } else {
      back.textContent = 'All set — you can close this tab.';
    }
    card.appendChild(back);
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Failed: ' + e.message;
    for (const b of card.querySelectorAll('button')) b.disabled = false;
  }
}

async function boot() {
  let ctx;
  try { ctx = await api('/wsapi/session_context'); } catch { ctx = {}; }
  if (!ctx.authenticated) {
    $('auth-gate').innerHTML = `<p class="pv-note" style="margin:0">You are not signed in.
      Consent requests are approved from your browserid session — sign in through any app's
      login dialog or <a href="/account">your account page</a> first, then reload.</p>`;
    return;
  }
  if (!window.Keystore || !window.crypto?.subtle) {
    $('auth-gate').innerHTML = `<p class="err" style="margin:0">This browser lacks the crypto needed to sign grants.</p>`;
    return;
  }
  csrf = ctx.csrf_token;
  $('auth-gate').hidden = true;
  // External requests are redirect-tied: they surface ONLY via their
  // /consent/<code> deep link, so pass the code through when we have one.
  const [resp, reg, emails] = await Promise.all([
    api('/wsapi/warrant_requests' + (linkedCode ? '?code=' + encodeURIComponent(linkedCode) : '')),
    api('/wsapi/warrants').catch(() => ({ warrants: [] })),
    api('/wsapi/list_emails').catch(() => ({ emails: [], agents: [] })),
  ]);
  statusUri = resp.status_uri || null;
  registry = reg.warrants || [];
  const agentSet = new Set((emails.agents || []).map(a => a.toLowerCase()));
  rootIds = (emails.emails || []).filter(e => !agentSet.has(e.toLowerCase()));
  render(resp.requests);
}

boot().catch(e => { $('auth-gate').hidden = false; $('auth-gate').innerHTML = `<p class="err" style="margin:0">Error: ${escapeHtml(e.message)}</p>`; });
</script>
</body>
</html>
