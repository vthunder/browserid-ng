<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <link rel="stylesheet" href="/common/css/ceremony.css" />
</head>
<body class="tenant-accent">
  <div class="card">
    <div class="brand-row tenant"><div class="brand-mark"></div><span id="brand-name">your identity provider</span></div>
    <h1 id="title">Sign in</h1>
    <p class="sub mono" id="subtitle"></p>

    <form id="login-form">
      <label for="password" id="password-label">Password</label>
      <input type="password" id="password" autocomplete="current-password" autofocus />
      <button type="submit" id="login-btn">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>

    <form id="change-form" class="hidden">
      <label for="cur">Current password</label>
      <input type="password" id="cur" autocomplete="current-password" />
      <label for="new1">New password</label>
      <input type="password" id="new1" autocomplete="new-password" />
      <label for="new2">Confirm new password</label>
      <input type="password" id="new2" autocomplete="new-password" />
      <button type="submit" id="change-btn">Set new password</button>
      <div class="err" id="change-err"></div>
    </form>

    <p class="muted" id="forgot">Forgot your password? Contact your domain administrator.</p>
    <p class="muted" id="brand">Sign-in hosted by browserid.me</p>
  </div>
  <script src="/common/js/idp-device-authorize.js"></script>
</body>
</html>
