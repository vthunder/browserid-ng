<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <link rel="stylesheet" href="/common/css/ceremony.css" />
</head>
<body>
  <div class="card">
    <div class="brand-row"><div class="brand-mark"></div><span>browserid</span></div>
    <h1 id="title">Sign in</h1>
    <p class="sub mono" id="subtitle"></p>

    <!-- Live session: an explicit consent gesture, never silent issuance
         (bean mxcn). -->
    <form id="confirm-form" class="hidden">
      <button type="submit" id="confirm-btn">Authorize this device</button>
      <button type="button" class="secondary" id="confirm-cancel">Cancel</button>
      <div class="err" id="confirm-err"></div>
    </form>

    <form id="login-form" class="hidden">
      <label for="password">browserid.me password</label>
      <input type="password" id="password" placeholder="browserid.me password" autocomplete="current-password" autofocus />
      <button type="submit" id="login-btn">Sign in</button>
      <button type="button" class="secondary" id="login-cancel">Cancel</button>
      <div class="err" id="login-err"></div>
    </form>

    <!-- Bridge-verified identities (Google / Bluesky): the proof runs at the
         bridge, in a popup; the click doubles as the consent gesture. -->
    <form id="bridge-form" class="hidden">
      <button type="submit" id="bridge-btn">Continue</button>
      <button type="button" class="secondary" id="bridge-cancel">Cancel</button>
      <div class="err" id="bridge-err"></div>
    </form>

    <!-- Stale SMTP verification (bean uboq): a fresh mailbox code before
         issuance resumes. -->
    <form id="verify-form" class="hidden">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" />
      <button type="submit" id="verify-btn">Verify</button>
      <button type="button" class="secondary" id="verify-cancel">Cancel</button>
      <div class="err" id="verify-err"></div>
    </form>

    <div id="fatal" class="hidden">
      <div class="err" id="fatal-msg"></div>
      <button type="button" class="secondary" id="fatal-close">Close</button>
    </div>
  </div>
  <script src="/common/js/fb-device-authorize.js"></script>
</body>
</html>
