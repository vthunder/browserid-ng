<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your email</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, -apple-system, sans-serif; margin: 2rem auto; max-width: 26rem; padding: 0 1rem; color: #1a1a1a; }
    @media (prefers-color-scheme: dark) { body { color: #e8e8e8; background: #161616; } }
    h3 { margin: 0 0 .25rem; }
    .who { font-weight: 600; word-break: break-all; }
    .muted { opacity: .7; }
    input { font: inherit; padding: .5rem; width: 100%; box-sizing: border-box; border: 1px solid rgba(127,127,127,.4); border-radius: 8px; background: transparent; color: inherit; }
    button { font: inherit; padding: .5rem .9rem; margin-top: .6rem; border-radius: 8px; border: 1px solid rgba(127,127,127,.4); background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: #2f855a; color: #fff; border-color: #2f855a; }
    button:disabled { opacity: .5; cursor: default; }
    .err { color: #c53030; } .ok { color: #2f855a; }
    .row { margin-top: 1rem; }
    #code-step { display: none; }
  </style>
</head>
<body>
  <h3>Verify your email</h3>
  <p class="muted">This site accepts email sign-in via this verifier. We'll email
    a one-time code to confirm you control the address.</p>
  <p>Email: <span class="who" id="email">…</span></p>

  <div id="send-step" class="row">
    <button class="primary" id="send">Email me a code</button>
  </div>

  <div id="code-step" class="row">
    <label class="muted" for="code">Enter the 6-digit code we emailed you:</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
    <button class="primary" id="verify">Verify</button>
  </div>

  <p id="msg" class="muted"></p>

  <script src="/authentication_api.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
