<!--
  SBO signer popup. A first-party broker window an RP opens (window.open) to
  sign a typed SBO envelope with the user's cert-bound key. See
  common/js/sbo-signer.js for the protocol. No user interaction required
  (consent granted at login); just a brief spinner, then it posts the signature
  back and closes.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Signing…</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; display: flex;
           align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0;
               border-top-color: #2563eb; border-radius: 50%;
               animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div id="status">connecting…</div>
    <div style="margin-top:10px;color:#94a3b8;font-size:12px;">
      SBO signer — you can leave this window open; it signs in the background.
    </div>
  </div>
  <!-- keystore.js (window.Keystore) holds the non-extractable identity key; it
       must load before sbo-signer.js reads it. sbo-sign.js (window.SboSign)
       must also load before sbo-signer.js. -->
  <script src="/common/js/keystore.js"></script>
  <script src="/common/js/sbo-sign.js"></script>
  <script src="/common/js/sbo-signer.js"></script>
</body>
</html>
