<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your domains — browserid.me</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --brand:#2563eb; --danger:#dc2626; --ok:#16a34a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --card:#22252b; --fg:#e8e8ea; --muted:#9096a1; --line:#33363d; } }
    * { box-sizing: border-box; }
    body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    .muted { color: var(--muted); }
    a { color: var(--brand); text-decoration: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 14px 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }
    .pill.active { color: var(--ok); border-color: var(--ok); }
    .pill.pending { color: #d97706; border-color: #d97706; }
    label { display:block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
    input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--bg); color: inherit; }
    button { padding: 9px 16px; border: 0; border-radius: 8px; background: var(--brand); color:#fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: default; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 13px; word-break: break-all; }
    .record { display:block; padding: 12px; margin-top: 8px; }
    .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
    .ok { color: var(--ok); }
    .hidden { display: none; }
    .toolbar { display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; }
    .toolbar > div { flex: 1; min-width: 140px; }
    .backlink { font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="signed-out" class="hidden">
      <h1>Your domains</h1>
      <p class="muted">You need to <a href="/account">sign in</a> to manage domains.</p>
    </div>

    <div id="app" class="hidden"></div>
  </div>
  <script src="/common/js/domains.js"></script>
</body>
</html>
