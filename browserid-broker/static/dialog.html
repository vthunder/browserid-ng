<!DOCTYPE html>
<!--
  BrowserID-NG Login Dialog — device-cert model.
  Mediates: email → discovery → IdP device-cert issuance (fallback SMTP or
  primary popup) → access-cert mint → config-cert-signed warrant → returns the
  4-object presentation (access_cert~assertion~warrant~config_cert) to the RP.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="dialog.css">
</head>
<body>
  <div id="dialog">
    <!-- Loading Screen -->
    <section id="loading" class="screen active">
      <div class="center">
        <div class="spinner"></div>
        <p id="loading-text">Loading...</p>
      </div>
    </section>

    <!-- Email Entry Screen -->
    <section id="email-screen" class="screen">
      <div class="content">
        <h2>Sign in to <span class="rp-name"></span></h2>

        <ul id="known-list" class="email-list" style="display:none"></ul>

        <form id="email-form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com"
                   autocomplete="email"
                   autocapitalize="off"
                   autocorrect="off"
                   required>
            <div class="error" id="email-error"></div>
          </div>

          <div class="button-row">
            <button type="submit" class="primary">Next</button>
            <button type="button" class="cancel">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Verification Code Screen (fallback IdP SMTP challenge) -->
    <section id="code-screen" class="screen">
      <div class="content">
        <h2>Check your email</h2>
        <p>We sent a sign-in code to <span class="email-display"></span></p>

        <form id="code-form">
          <div class="form-group">
            <label for="code">Sign-in code</label>
            <input type="text" id="code" name="code"
                   placeholder="000000"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   autocomplete="one-time-code"
                   inputmode="numeric"
                   required>
            <div class="error" id="code-error"></div>
          </div>

          <div class="button-row">
            <button type="submit" class="primary">Verify</button>
            <button type="button" class="back">Back</button>
          </div>

          <p class="link-row">
            <a href="#" id="resend-code-link">Resend code</a>
          </p>
        </form>
      </div>
    </section>

    <!-- Primary-IdP continue screen: shown when the popup to the identity
         provider was blocked (or on mobile) so the user can open it inside a
         fresh tap gesture. -->
    <section id="primary-continue-screen" class="screen">
      <div class="content">
        <h2>Sign in with your email provider</h2>
        <p><strong class="email-display"></strong> is managed by
           <strong class="idp-name"></strong>. Tap continue to sign in there.</p>

        <div class="button-row">
          <button type="button" id="continue-primary" class="primary">Continue</button>
          <button type="button" class="cancel">Cancel</button>
        </div>
      </div>
    </section>

    <!-- Success Screen -->
    <section id="success-screen" class="screen">
      <div class="content center">
        <div class="checkmark">&#10003;</div>
        <h2>Signed in!</h2>
        <p>Returning to <span class="rp-name"></span>...</p>
      </div>
    </section>

    <!-- Error Screen -->
    <section id="error-screen" class="screen">
      <div class="content center">
        <h2>Something went wrong</h2>
        <p class="error-message"></p>
        <div class="button-row">
          <button type="button" class="primary try-again">Try Again</button>
          <button type="button" class="cancel">Cancel</button>
        </div>
      </div>
    </section>
  </div>

  <script src="/common/js/keystore.js"></script>
  <script src="winchan.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
